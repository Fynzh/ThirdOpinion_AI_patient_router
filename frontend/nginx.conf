server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Все пути отдают index.html, чтобы работали маршруты React
  location / {
    try_files $uri /index.html;
  }

  # Запросы к API уходят в контейнер бэкенда (имя сервиса из docker-compose)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }
  location /media/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }
}