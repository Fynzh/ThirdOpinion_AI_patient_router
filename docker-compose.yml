services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./data/demo:/app/data/demo:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy