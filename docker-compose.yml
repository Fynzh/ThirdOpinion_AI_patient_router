services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_PATH: /app/data/db/db.sqlite3
      PATIENT_REGISTRY_PATH: /app/data/registry/patient_registry.json
    volumes:
      - ./data/db:/app/data/db
      - ./data/registry:/app/data/registry
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/')"]
      interval: 10s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy